resources:
  jobs:
    order_pipeline:
      name: order_pipeline
      max_concurrent_runs: 1              schedule:
        quartz_cron_expression: "0 0/15 * * * ?"           timezone_id: UTC
        pause_status: PAUSED              parameters:                           - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: secret_scope
          default: ${var.secret_scope}
        - name: trigger
          default: available_now
            tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/notebooks/01_bronze.py
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../src/notebooks/02_silver.py
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../src/notebooks/03_gold.py
        - task_key: validate
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ../src/notebooks/04_validate.py
            